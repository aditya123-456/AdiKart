{% extends "base.html" %}

{% block content %}

<section class="section-conten padding-y">
    <div class="container" style="max-width: 500px;">

        <div class="card">
            <header class="card-header">
                <a href="{% url 'register' %}" class="float-right btn btn-outline-primary">
                    Sign up
                </a>

                <h4 class="card-title mb-0">
                    Sign in
                </h4>
            </header>

            <div class="card-body">

                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Email Address</label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               placeholder="Email Address"
                               required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               placeholder="Password"
                               required>
                    </div>

                    <div class="text-right mb-3">
                        <a href="{% url 'forgot_password' %}">
                            Forgot Password?
                        </a>
                    </div>

                    <button type="submit"
                            class="btn btn-primary btn-block">
                        Login
                    </button>

                </form>

            </div>
        </div>

        <p class="text-center mt-3">
            Don't have an account?
            <a href="{% url 'register' %}">
                Sign up
            </a>
        </p>

    </div>
</section>

{% endblock %}
