{% load static %}

<!DOCTYPE HTML>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>AdiKart</title>

    <link href="{% static 'images/favicon.ico' %}"
          rel="shortcut icon"
          type="image/x-icon">


    <!-- jQuery -->

    <script src="{% static 'js/jquery-2.0.0.min.js' %}"
            type="text/javascript">
    </script>


    <!-- Bootstrap -->

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"
            type="text/javascript">
    </script>


    <!-- Bootstrap CSS -->

    <link href="{% static 'css/bootstrap.css' %}"
          rel="stylesheet"
          type="text/css">


    <!-- Font Awesome -->

    <link href="{% static 'fonts/fontawesome/css/all.min.css' %}"
          type="text/css"
          rel="stylesheet">


    <!-- UI CSS -->

    <link href="{% static 'css/ui.css' %}"
          rel="stylesheet"
          type="text/css">


    <!-- Responsive CSS -->

    <link href="{% static 'css/responsive.css' %}"
          rel="stylesheet"
          type="text/css">


    <!-- Custom JS -->

    <script src="{% static 'js/script.js' %}"
            type="text/javascript">
    </script>

</head>


<body>


<header class="section-header">

    <section class="header-main border-bottom">

        <div class="container">

            <div class="row align-items-center">

                <!-- AdiKart Logo -->

                <div class="col-lg-2 col-md-3 col-6">

                    <a href="/" class="brand-wrap">

                        <h1 style="color: #3167eb;
                                   font-size: 28px;
                                   font-weight: bold;
                                   margin: 0;">

                            AdiKart

                        </h1>

                    </a>

                </div>


                <!-- Category -->

                <div class="col-lg-2 col-md-3 col-6">

                    <div class="category-wrap dropdown">

                        <button class="btn btn-primary dropdown-toggle"
                                data-toggle="dropdown">

                            <i class="fa fa-bars"></i>

                            All category

                        </button>

                        <div class="dropdown-menu">

                            <a class="dropdown-item"
                               href="/store/">

                                All Products

                            </a>


                            {% for category in categories %}

                            <a class="dropdown-item"
                               href="{% url 'products_by_category' category.slug %}">

                                {{ category.category_name }}

                            </a>

                            {% endfor %}

                        </div>

                    </div>

                </div>


                <!-- Store Button -->

                <div class="col-lg-auto col-md-auto col-6">

                    <a href="/store/"
                       class="btn btn-outline-primary">

                        Store

                    </a>

                </div>


                <!-- Search -->

                <div class="col-lg col-md-6 col-12">

                    <form class="search"
                          action="/store/"
                          method="GET">

                        <div class="input-group">

                            <input type="text"
                                   name="keyword"
                                   class="form-control"
                                   placeholder="Search"
                                   value="{{ keyword|default:'' }}">


                            <div class="input-group-append">

                                <button class="btn btn-primary"
                                        type="submit">

                                    <i class="fa fa-search"></i>

                                </button>

                            </div>

                        </div>

                    </form>

                </div>


                <!-- User -->

                <div class="col-lg-2 col-md-3 col-6">

                    <div class="widgets-wrap">

                        <div class="widget-header">

                            <small class="text-muted">
                                Welcome guest!
                            </small>

                            <div>

                                <a href="#">
                                    Sign in
                                </a>

                                <span class="dark-transp">
                                    |
                                </span>

                                <a href="#">
                                    Register
                                </a>

                            </div>

                        </div>


                        <!-- Cart -->

                        <a href="{% url 'cart' %}"
                           class="widget-header pl-3">

                            <div class="icon icon-sm rounded-circle border">

                                <i class="fa fa-shopping-cart"></i>

                            </div>

                            <span class="badge badge-pill badge-danger notify">

                                {{ cart_count }}

                            </span>

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </section>

</header>


<!-- Main Content -->

{% block content %}

{% endblock %}


<!-- Footer -->

<footer class="section-footer border-top">

    <div class="container">

        <section class="footer-bottom row">

            <div class="col-md-6">

                <p class="text-muted">

                    © 2026 AdiKart. All rights reserved.

                </p>

            </div>

        </section>

    </div>

</footer>


</body>

</html>
