{% load static %}

<!DOCTYPE HTML>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>AdiKart</title>

<link href="{% static 'images/favicon.ico' %}" rel="shortcut icon" type="image/x-icon">

<script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>

<script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>

<link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>

<link href="{% static 'fonts/fontawesome/css/all.min.css' %}" type="text/css" rel="stylesheet">

<link href="{% static 'css/ui.css' %}" rel="stylesheet" type="text/css"/>

<link href="{% static 'css/responsive.css' %}" rel="stylesheet" type="text/css"/>

<script src="{% static 'js/script.js' %}" type="text/javascript"></script>

</head>

<body>

<header class="section-header">

<nav class="navbar p-md-0 navbar-expand-sm navbar-light border-bottom">

<div class="container">

<button class="navbar-toggler" type="button"
data-toggle="collapse"
data-target="#navbarTop4">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarTop4">

<ul class="navbar-nav mr-auto">

<li class="nav-item">
<a href="#" class="nav-link">English</a>
</li>

<li class="nav-item">
<a href="#" class="nav-link">INR</a>
</li>

</ul>

<ul class="navbar-nav">

<li>
<a href="#" class="nav-link">
<i class="fa fa-envelope"></i> Email
</a>
</li>

<li>
<a href="#" class="nav-link">
<i class="fa fa-phone"></i> Call us
</a>
</li>

</ul>

</div>

</div>

</nav>


<section class="header-main border-bottom">

<div class="container">

<div class="row align-items-center">

<div class="col-lg-2 col-md-3 col-6">

<a href="/" class="brand-wrap">

<h1>AdiKart</h1>

</a>

</div>


<div class="col-lg col-sm col-md col-6 flex-grow-0" style="white-space: nowrap;">

<div class="category-wrap dropdown d-inline-block">

<button type="button"
class="btn btn-primary dropdown-toggle"
data-toggle="dropdown">

<i class="fa fa-bars"></i> All category

</button>

<div class="dropdown-menu">

{% for category in categories %}

<a class="dropdown-item"
href="{% url 'products_by_category' category.slug %}">

{{ category.category_name }}

</a>

{% endfor %}

</div>

</div>

<a href="/store/" class="btn btn-outline-primary">

Store

</a>

</div>


<div class="col-lg col-md-6 col-sm-12 col">

<form action="#" class="search">

<div class="input-group w-100">

<input type="text"
class="form-control"
style="width:60%;"
placeholder="Search">

<div class="input-group-append">

<button class="btn btn-primary" type="submit">

<i class="fa fa-search"></i>

</button>

</div>

</div>

</form>

</div>


<div class="col-lg-3 col-sm-6 col-8 order-2 order-lg-3">

<div class="d-flex justify-content-end mb-3 mb-lg-0">

<div class="widget-header">

<small class="title text-muted">
Welcome guest!
</small>

<div>

<a href="#">Sign in</a>

<span class="dark-transp"> | </span>

<a href="#">Register</a>

</div>

</div>


<a href="#" class="widget-header pl-3 ml-3">

<div class="icon icon-sm rounded-circle border">

<i class="fa fa-shopping-cart"></i>

</div>

<span class="badge badge-pill badge-danger notify">
0
</span>

</a>

</div>

</div>

</div>

</div>

</section>

</header>


{% block content %}

{% endblock %}


<footer class="section-footer border-top">

<div class="container">

<section class="footer-bottom border-top row">

<div class="col-md-2">

<p class="text-muted">
© 2026 AdiKart
</p>

</div>

<div class="col-md-8 text-md-center">

<span class="px-2">
info@adikart.com
</span>

<span class="px-2">
+91 00000 00000
</span>

<span class="px-2">
India
</span>

</div>

<div class="col-md-2 text-md-right text-muted">

<i class="fab fa-lg fa-cc-visa"></i>

<i class="fab fa-lg fa-cc-paypal"></i>

<i class="fab fa-lg fa-cc-mastercard"></i>

</div>

</section>

</div>

</footer>

</body>

</html>
</html>
