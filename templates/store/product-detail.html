{% extends "base.html" %}

{% block content %}

<section class="section-content padding-y bg">

    <div class="container">

        <div class="card">

            <div class="row no-gutters">

                <!-- Product Image -->
                <aside class="col-md-6">

                    <article class="gallery-wrap">

                        <div class="img-big-wrap">

                            <div class="text-center p-4">

                                {% if product.images %}
                                    <img src="{{ product.images.url }}"
                                         alt="{{ product.product_name }}"
                                         style="max-width:100%; height:400px; object-fit:contain;">
                                {% else %}
                                    <p>No image available</p>
                                {% endif %}

                            </div>

                        </div>

                    </article>

                </aside>


                <!-- Product Details -->
                <main class="col-md-6 border-left">

                    <article class="content-body">

                        <h2 class="title">
                            {{ product.product_name }}
                        </h2>

                        <div class="mb-3">

                            <var class="price h4">
                                ₹{{ product.price }}
                            </var>

                        </div>

                        <p>
                            {{ product.description }}
                        </p>


                        <hr>


                        <!-- Add to Cart -->
                        <form action="{% url 'add_to_cart' product.id %}"
                              method="GET">

                            <!-- Color -->
                            <div class="form-group">

                                <label>
                                    <strong>Color</strong>
                                </label>

                                <select name="color"
                                        class="form-control"
                                        required>

                                    <option value="">
                                        Select Color
                                    </option>

                                    <option value="Green">
                                        Green
                                    </option>

                                    <option value="Black">
                                        Black
                                    </option>

                                    <option value="Red">
                                        Red
                                    </option>

                                    <option value="Blue">
                                        Blue
                                    </option>

                                </select>

                            </div>


                            <!-- Size -->
                            <div class="form-group">

                                <label>
                                    <strong>Size</strong>
                                </label>

                                <select name="size"
                                        class="form-control"
                                        required>

                                    <option value="">
                                        Select Size
                                    </option>

                                    <option value="Small">
                                        Small
                                    </option>

                                    <option value="Medium">
                                        Medium
                                    </option>

                                    <option value="Large">
                                        Large
                                    </option>

                                    <option value="XL">
                                        XL
                                    </option>

                                </select>

                            </div>


                            <!-- Add to Cart Button -->
                            <button type="submit"
                                    class="btn btn-primary btn-block">

                                <i class="fa fa-shopping-cart"></i>

                                Add to Cart

                            </button>

                        </form>

                    </article>

                </main>

            </div>

        </div>

    </div>

</section>

{% endblock %}
