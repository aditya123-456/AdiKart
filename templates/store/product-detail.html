{% extends "base.html" %}
{% load static %}

{% block content %}

<section class="section-content padding-y bg">

<div class="container">

<div class="card">

<div class="row">

    <aside class="col-md-6">
        <article class="gallery-wrap">
            <div class="img-big-wrap">
                <img src="{{ product.images.url }}"
                     class="img-fluid"
                     style="width: 100%; height: 500px; object-fit: contain;">
            </div>
        </article>
    </aside>

    <main class="col-md-6">
        <article class="product-info">

            <h2 class="title">{{ product.product_name }}</h2>

            <div class="mb-3">
                <var class="price h3">₹{{ product.price }}</var>
            </div>

            <p>{{ product.description }}</p>

            <hr>

            <div class="mb-4">
                <h6>Choose Color</h6>

                <div class="btn-group">
                    <button type="button" class="btn btn-light">Silver</button>
                    <button type="button" class="btn btn-light">Gray</button>
                    <button type="button" class="btn btn-secondary">Gold</button>
                    <button type="button" class="btn btn-light">Black</button>
                </div>
            </div>

            <div class="mb-4">
                <h6>Select Size</h6>

                <div class="btn-group">
                    <button type="button" class="btn btn-light">S</button>
                    <button type="button" class="btn btn-secondary">M</button>
                    <button type="button" class="btn btn-light">L</button>
                    <button type="button" class="btn btn-light">XL</button>
                </div>
            </div>

            <hr>

            {% if product.is_available %}

                <div class="mt-4">
                    <a href="{% url 'add_to_cart' product.id %}"
                       class="btn btn-success">
                        Add to Cart ✓
                    </a>

                    <a href="{% url 'cart' %}"
                       class="btn btn-outline-primary">
                        View Cart 👁
                    </a>
                </div>

            {% else %}

                <div class="mt-4">
                    <h4 style="color: red;">
                        Out of Stock
                    </h4>
                </div>

            {% endif %}

        </article>
    </main>

</div>

</div>

</div>

</section>

{% endblock %}
