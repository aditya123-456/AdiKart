{% extends "base.html" %}

{% block content %}

<section class="section-content padding-y bg">

<div class="container">

<div class="card">

<div class="row no-gutters">

<aside class="col-md-6">

<article class="gallery-wrap">

<div class="img-big-wrap">

<a href="#">

<img src="{{ single_product.images.url }}">

</a>

</div>

</article>

</aside>


<main class="col-md-6 border-left">

<article class="content-body">

<h2 class="title">
{{ single_product.product_name }}
</h2>

<div class="mb-3">

<var class="price h4">
₹{{ single_product.price }}
</var>

</div>

<p>
{{ single_product.description }}
</p>

<hr>

<div class="row">

<div class="item-option-select">

<h6>Choose Color</h6>

<div class="btn-group btn-group-sm btn-group-toggle"
data-toggle="buttons">

<label class="btn btn-light">
<input type="radio" name="radio_color"> Silver
</label>

<label class="btn btn-light">
<input type="radio" name="radio_color"> Gray
</label>

<label class="btn btn-light">
<input type="radio" name="radio_color"> Gold
</label>

<label class="btn btn-light">
<input type="radio" name="radio_color"> Black
</label>

</div>

</div>

</div>


<div class="row">

<div class="item-option-select">

<h6>Select Size</h6>

<div class="btn-group btn-group-sm btn-group-toggle"
data-toggle="buttons">

<label class="btn btn-light">
<input type="radio" name="radio_size"> S
</label>

<label class="btn btn-light">
<input type="radio" name="radio_size"> M
</label>

<label class="btn btn-light">
<input type="radio" name="radio_size"> L
</label>

<label class="btn btn-light">
<input type="radio" name="radio_size"> XL
</label>

</div>

</div>

</div>


<hr>

<a href="#" class="btn btn-primary">
Add to cart
</a>

</article>

</main>

</div>

</div>

<br>


<div class="card">

<div class="card-body">

<h4>Customer Reviews</h4>

</div>

</div>

</div>

</section>

{% endblock %}
