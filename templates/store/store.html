{% extends "base.html" %}

{% block content %}

<section class="section-pagetop bg">
<div class="container">
    <h2 class="title-page">Our Store</h2>
</div>
</section>


<section class="section-content padding-y">
<div class="container">

<div class="row">

<aside class="col-md-3">

<div class="card">

<article class="filter-group">

<header class="card-header">
    <a href="#" class="title" data-toggle="collapse" data-target="#collapse_1">
        <i class="icon-control fa fa-chevron-down"></i>
        <h6 class="title">Categories</h6>
    </a>
</header>

<div class="filter-content collapse show" id="collapse_1">

<div class="card-body">

<ul class="list-menu">

{% for category in categories %}

<li>
    <a href="{% url 'products_by_category' category.slug %}">
        {{ category.category_name }}
    </a>
</li>

{% endfor %}

</ul>

</div>

</div>

</article>


<article class="filter-group">

<header class="card-header">
    <a href="#" class="title" data-toggle="collapse" data-target="#collapse_2">
        <i class="icon-control fa fa-chevron-down"></i>
        <h6 class="title">Sizes</h6>
    </a>
</header>

<div class="filter-content collapse show" id="collapse_2">

<div class="card-body">

<label class="checkbox-btn">
    <input type="checkbox">
    <span class="btn btn-light">XS</span>
</label>

<label class="checkbox-btn">
    <input type="checkbox">
    <span class="btn btn-light">SM</span>
</label>

<label class="checkbox-btn">
    <input type="checkbox">
    <span class="btn btn-light">LG</span>
</label>

<label class="checkbox-btn">
    <input type="checkbox">
    <span class="btn btn-light">XXL</span>
</label>

</div>

</div>

</article>


<article class="filter-group">

<header class="card-header">
    <a href="#" class="title" data-toggle="collapse" data-target="#collapse_3">
        <i class="icon-control fa fa-chevron-down"></i>
        <h6 class="title">Price range</h6>
    </a>
</header>

<div class="filter-content collapse show" id="collapse_3">

<div class="card-body">

<div class="form-row">

<div class="form-group col-md-6">

<label>Min</label>

<input class="form-control" placeholder="₹0" type="number">

</div>

<div class="form-group text-right col-md-6">

<label>Max</label>

<input class="form-control" placeholder="₹10000" type="number">

</div>

</div>

<button class="btn btn-block btn-primary">
Apply
</button>

</div>

</div>

</article>

</div>

</aside>


<main class="col-md-9">

<header class="border-bottom mb-4 pb-3">

<div class="form-inline">

<span class="mr-md-auto">
{{ product_count }} Items found
</span>

</div>

</header>


<div class="row">

{% for product in products %}

<div class="col-md-4">

<figure class="card card-product-grid">

<div class="img-wrap">

<a href="{% url 'product_detail' product.category.slug product.slug %}">

<img src="{{ product.images.url }}" class="img-fluid">

</a>

</div>

<figcaption class="info-wrap">

<a href="{% url 'product_detail' product.category.slug product.slug %}" class="title">

{{ product.product_name }}

</a>

<div class="price mt-1">

₹{{ product.price }}

</div>

<a href="#" class="btn btn-primary btn-block mt-3">

Add to Cart

</a>

</figcaption>

</figure>

</div>

{% endfor %}

</div>

</main>

</div>

</div>

</section>

{% endblock %}
