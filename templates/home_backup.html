{% load static %}

<!DOCTYPE HTML>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <title>AdiKart | One of the Biggest Online Shopping Platform</title>

    <link href="{% static 'css/bootstrap.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/ui.css' %}" rel="stylesheet" type="text/css"/>
    <link href="{% static 'css/responsive.css' %}" rel="stylesheet" type="text/css"/>

    <script src="{% static 'js/jquery-2.0.0.min.js' %}" type="text/javascript"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}" type="text/javascript"></script>

</head>

<body>


<header class="section-header">

<nav class="navbar navbar-light navbar-expand p-0">
<div class="container">

    <a href="/" class="navbar-brand">
        <h2>AdiKart</h2>
    </a>

    <div class="category-wrap dropdown">
        <button class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
            <i class="fa fa-bars"></i> All category
        </button>

        <div class="dropdown-menu">
            <a class="dropdown-item" href="/store/">All Products</a>
        </div>
    </div>

    <a href="/store/" class="btn btn-outline-primary ml-2">
        Store
    </a>

    <form action="#" class="search ml-3">

        <div class="input-group">

            <input type="text"
                   class="form-control"
                   placeholder="Search">

            <div class="input-group-append">

                <button class="btn btn-primary" type="submit">
                    <i class="fa fa-search"></i>
                </button>

            </div>

        </div>

    </form>

    <div class="widgets-wrap ml-auto">

        <div class="widget-header">

            <small class="title text-muted">
                Welcome guest!
            </small>

            <div>
                <a href="#">Sign in</a>
                <span class="dark-transp"> | </span>
                <a href="#">Register</a>
            </div>

        </div>

        <div class="widget-header">

            <a href="{% url 'cart' %}" class="icon icon-sm rounded-circle border">
                <i class="fa fa-shopping-cart"></i>
            </a>

        </div>

    </div>

</div>
</nav>

</header>


<section class="section-intro padding-y-sm">

<div class="container">

    <div class="intro-banner-wrap">

        <img src="{% static 'images/banners/1.jpg' %}"
             class="img-fluid rounded">

    </div>

</div>

</section>


<section class="section-name padding-y-sm">

<div class="container">

<header class="section-heading">

    <h3 class="section-title">
        Popular Products
    </h3>

    <a href="/store/" class="btn btn-outline-primary">
        See all
    </a>

</header>


<div class="row">

{% for product in products %}

<div class="col-md-3">

    <div class="card card-product-grid">

        <a href="#" class="img-wrap">

            <img src="{{ product.images.url }}">

        </a>


        <figcaption class="info-wrap">

            <a href="#" class="title">
                {{ product.product_name }}
            </a>


            <div class="price mt-1">
                ₹{{ product.price }}
            </div>


            <a href="{% url 'add_to_cart' product.id %}"
               class="btn btn-primary btn-block mt-2">

                Add to Cart

            </a>


            <a href="{% url 'cart' %}"
               class="btn btn-light btn-block">

                View Cart

            </a>

        </figcaption>

    </div>

</div>

{% empty %}

<div class="col-md-12">

    <p class="text-center">
        No products available.
    </p>

</div>

{% endfor %}

</div>

</div>

</section>


<footer class="section-footer border-top padding-y">

<div class="container">

    <p class="text-center text-muted">
        © 2026 AdiKart. All rights reserved.
    </p>

</div>

</footer>


<script src="{% static 'js/script.js' %}" type="text/javascript"></script>

</body>

</html>
